[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-web-tool-calling"
version = "0.1.0"
description = "qwen-tool-calling behind a web server: FastAPI + LiteLLM + Gemini, with tool calls shown in the UI"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "litellm>=1.50",
    "google-cloud-aiplatform>=1.40.0",
    "requests>=2.31",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: hits real Spoonacular/Gemini APIs -- costs quota, slower, non-deterministic. Run explicitly with -m integration.",
]
addopts = "-m 'not integration'"

[tool.setuptools]
py-modules = ["app", "tools"]
