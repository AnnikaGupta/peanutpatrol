<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Peanut Patrol</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap"
            rel="stylesheet"
        />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        />
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            :root {
                /* Grounded in the provided logo's own sampled colors, not a
                   generic warm-neutral default. */
                --paper: #fdfcf9;
                --ink: #3b2a1e;
                --shell: #deb06d;
                --shell-rgb: 222, 176, 109;
                --contains: #9c3b2a;
                --line: #e4d9c3;
                --muted: #8a7560;
                --radius: 8px;
            }
            html, body {
                height: 100%;
            }
            body {
                font-family: "Manrope", system-ui, sans-serif;
                /* Ivory wash (~10% opacity) over the pattern so it reads as
                   backdrop texture rather than competing with the card. */
                background:
                    linear-gradient(rgba(253, 252, 249, 0.1), rgba(253, 252, 249, 0.1)),
                    var(--paper) url("/allergen_pattern.png") repeat;
                background-size: auto, 560px auto;
                color: var(--ink);
                font-size: 15px;
                line-height: 1.6;
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 2rem 1rem;
            }
            #app {
                width: 100%;
                max-width: 828px;
                max-height: 90vh;
                display: flex;
                flex-direction: column;
                background: var(--paper);
                border: 1px solid var(--line);
                border-radius: var(--radius);
                /* Two-layer shadow (tight + diffuse) so the card reads as
                   floating above the busy illustrated backdrop. */
                box-shadow:
                    0 2px 8px rgba(59, 42, 30, 0.12),
                    0 16px 48px rgba(59, 42, 30, 0.26);
                overflow: hidden;
            }

            /* ---------- Header ---------- */
            header {
                position: relative;
                display: flex;
                align-items: center;
                gap: 0.9rem;
                padding: 1.6rem 1.75rem 1.4rem;
                border-bottom: 1px solid var(--line);
            }
            header::before {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                height: 5px;
                width: 100%;
                background: var(--ink);
                transform: scaleX(0);
                transform-origin: left;
                animation: draw-rule 0.7s ease-out 0.1s forwards;
            }
            @media (prefers-reduced-motion: reduce) {
                header::before { animation: none; transform: scaleX(1); }
            }
            @keyframes draw-rule {
                to { transform: scaleX(1); }
            }
            header img {
                width: 46px;
                height: 46px;
                border-radius: var(--radius);
                flex-shrink: 0;
            }
            header h1 {
                font-family: "Manrope", sans-serif;
                font-weight: 800;
                font-size: 1.7rem;
                letter-spacing: -0.01em;
            }
            header p {
                margin-top: 0.2rem;
                font-size: 0.85rem;
                color: var(--muted);
                max-width: 42ch;
            }

            /* ---------- Intro card (rendered as the first entry inside
               #messages, so it scrolls away with the rest of the
               conversation instead of staying permanently pinned) ---------- */
            .intro-card {
                padding: 1.1rem 1.25rem;
                border: 1px solid var(--line);
                border-radius: var(--radius);
                background: rgba(var(--shell-rgb), 0.08);
            }
            .intro-lede {
                font-size: 0.88rem;
                color: var(--muted);
                margin-bottom: 0.85rem;
            }
            .capability {
                margin-bottom: 0.85rem;
            }
            .capability:last-of-type {
                margin-bottom: 0;
            }
            .cap-name {
                font-family: "Manrope", sans-serif;
                font-weight: 600;
                font-size: 0.95rem;
            }
            .cap-desc {
                font-size: 0.86rem;
                color: var(--muted);
                margin-top: 0.1rem;
            }
            .intro-ask {
                font-size: 0.88rem;
                font-weight: 500;
                margin-top: 1rem;
            }

            /* ---------- Suggested actions ---------- */
            #starters {
                padding: 1rem 1.75rem;
                display: flex;
                flex-wrap: wrap;
                gap: 0.55rem;
            }
            .chip {
                font-family: "Manrope", sans-serif;
                font-weight: 600;
                font-size: 0.85rem;
                padding: 0.55rem 0.95rem;
                background: var(--paper);
                border: 1px solid var(--line);
                border-radius: var(--radius);
                color: var(--ink);
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                gap: 0.45rem;
            }
            .chip i {
                color: var(--ink);
                font-size: 0.82em;
            }
            .chip:hover {
                border-color: var(--shell);
                background: rgba(var(--shell-rgb), 0.14);
            }
            .chip:focus-visible {
                outline: 2px solid var(--shell);
                outline-offset: 2px;
            }

            /* ---------- Message list ---------- */
            /* flex: 1 + min-height: 0 lets this shrink to share space with its
               fixed-size siblings inside #app's capped height, so it's the
               only thing that scrolls -- header/starters/input/disclaimer
               stay fully visible instead of being clipped by #app's overflow. */
            #messages {
                flex: 1 1 auto;
                min-height: 0;
                overflow-y: auto;
                padding: 1rem 1.75rem;
                display: flex;
                flex-direction: column;
                gap: 0.75rem;
            }
            .msg {
                max-width: 68ch;
                padding: 0.55rem 0.85rem;
                border-left: 2px solid var(--line);
                border-radius: 0 var(--radius) var(--radius) 0;
            }
            .msg.assistant {
                border-left-color: var(--shell);
                background: rgba(var(--shell-rgb), 0.05);
            }
            .msg .role {
                font-family: "Manrope", sans-serif;
                font-weight: 600;
                font-size: 0.68rem;
                text-transform: uppercase;
                letter-spacing: 0.04em;
                color: var(--muted);
                margin-bottom: 0.2rem;
            }
            .msg .content p { margin: 0.45em 0; }
            .msg .content p:first-child { margin-top: 0; }
            .msg .content p:last-child { margin-bottom: 0; }
            .msg .content ul, .msg .content ol { margin: 0.45em 0 0.45em 1.2em; }
            .msg .content strong { font-weight: 600; }
            .msg.loading .content {
                color: var(--muted);
                font-style: italic;
            }

            /* ---------- Input row ---------- */
            #input-row {
                display: flex;
                gap: 0.6rem;
                padding: 1rem 1.75rem;
                border-top: 1px solid var(--line);
            }
            #user-input {
                flex: 1;
                padding: 0.75rem 1rem;
                border: 1px solid var(--line);
                border-radius: var(--radius);
                background: var(--paper);
                color: var(--ink);
                font-family: inherit;
                font-size: 0.92rem;
            }
            #user-input:focus-visible {
                outline: none;
                border-color: var(--shell);
                box-shadow: 0 0 0 3px rgba(var(--shell-rgb), 0.18);
            }
            #send-btn {
                font-family: "Manrope", sans-serif;
                font-weight: 600;
                font-size: 0.85rem;
                padding: 0.7rem 1.5rem;
                background: var(--shell);
                color: var(--ink);
                border: 1px solid var(--shell);
                border-radius: var(--radius);
                cursor: pointer;
            }
            #send-btn:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
            #send-btn:focus-visible { outline: 2px solid var(--shell); outline-offset: 2px; }
            #send-btn:disabled { opacity: 0.4; cursor: default; }

            /* ---------- Footer disclaimer ---------- */
            #disclaimer {
                display: flex;
                align-items: baseline;
                gap: 0.55rem;
                padding: 0.7rem 1.75rem;
                font-size: 0.72rem;
                color: var(--muted);
                background: rgba(var(--shell-rgb), 0.06);
                border-top: 1px solid var(--line);
            }
            #disclaimer .mark {
                flex-shrink: 0;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 1.1rem;
                height: 1.1rem;
                border: 1px solid var(--muted);
                border-radius: 50%;
                font-family: "Manrope", sans-serif;
                font-weight: 600;
                font-size: 0.65rem;
            }

            /* ---------- Tool cards ---------- */
            .tool-card {
                max-width: 68ch;
                border: 1px solid var(--line);
                border-left: 3px solid var(--ink);
                border-radius: 0 var(--radius) var(--radius) 0;
                padding: 0.75rem 0.9rem;
            }
            .tool-card.status-contains { border-left-color: var(--contains); }
            .tool-card .tool-head {
                display: flex;
                flex-wrap: wrap;
                align-items: baseline;
                gap: 0.5rem;
                padding-bottom: 0.45rem;
                margin-bottom: 0.55rem;
                border-bottom: 1px solid var(--line);
            }
            .tool-head .tool-name {
                font-family: "Manrope", sans-serif;
                font-weight: 600;
                font-size: 0.68rem;
                text-transform: uppercase;
                letter-spacing: 0.03em;
                color: var(--muted);
            }
            .tool-head .tool-target {
                font-size: 0.82rem;
                color: var(--ink);
            }
            /* Status tags stay sharp-edged (no radius) -- deliberately more
               "stamped/authoritative" than the rest of the warmer chrome,
               since this is the one safety-critical signal in the UI. */
            .status-tag {
                font-family: "Manrope", sans-serif;
                font-weight: 600;
                font-size: 0.66rem;
                text-transform: uppercase;
                letter-spacing: 0.03em;
                padding: 0.1rem 0.45rem;
                border: 1px solid var(--ink);
            }
            .status-tag.contains { background: var(--contains); color: var(--paper); border-color: var(--contains); }
            .status-tag.not-listed { background: var(--paper); color: var(--ink); }
            .status-tag.ask { background: var(--paper); color: var(--muted); border: 1px dashed var(--muted); }
            .status-tag.error { background: var(--paper); color: var(--contains); border: 1px dashed var(--contains); }

            .tool-body .field-value { margin-bottom: 0.5rem; }
            .tool-body .field-value:last-child { margin-bottom: 0; }
            .field-label {
                font-family: "Manrope", sans-serif;
                font-weight: 600;
                font-size: 0.66rem;
                text-transform: uppercase;
                letter-spacing: 0.03em;
                color: var(--muted);
                margin: 0.6rem 0 0.2rem;
            }
            .tool-body ul {
                list-style: none;
            }
            .tool-body li {
                font-size: 0.88rem;
                padding: 0.2rem 0;
                border-bottom: 1px dotted var(--line);
            }
            .tool-body li:last-child { border-bottom: none; }
            .suggestion-line {
                font-size: 0.8rem;
                color: var(--muted);
                margin-top: 0.4rem;
            }
            .warning-compact {
                font-size: 0.72rem;
                color: var(--muted);
                margin-top: 0.5rem;
            }
        </style>
    </head>
    <body>
        <div id="app">
            <header>
                <img src="/peanutpatrol_img.png" alt="" />
                <div>
                    <h1>Peanut Patrol</h1>
                    <p>A field guide for eating out and cooking with food allergies.</p>
                </div>
            </header>
            <div id="messages"></div>
            <div id="starters">
                <button class="chip" data-q="I want to check if a dish at a restaurant is safe for my allergies."><i class="fa-solid fa-utensils"></i>Check a dish</button>
                <button class="chip" data-q="I want to find a substitute for an ingredient I'm allergic to in a recipe."><i class="fa-solid fa-right-left"></i>Find a substitute</button>
                <button class="chip" data-q="I'm traveling soon and want an allergy card for my allergies."><i class="fa-solid fa-plane"></i>Get a travel card</button>
            </div>
            <div id="input-row">
                <input
                    type="text"
                    id="user-input"
                    placeholder="Ask about a dish, a substitute, or a travel card"
                    autocomplete="off"
                />
                <button id="send-btn">Ask</button>
            </div>
            <div id="disclaimer">
                <span class="mark">!</span>
                <span>Ingredient data doesn't guarantee absence of cross-contact. Always confirm with restaurant staff.</span>
            </div>
        </div>
        <script>
            const messagesEl = document.getElementById("messages");
            const userInput = document.getElementById("user-input");
            const sendBtn = document.getElementById("send-btn");
            const startersEl = document.getElementById("starters");
            let sessionId = null;

            function addMessage(role, text, isLoading = false) {
                const div = document.createElement("div");
                div.className =
                    "msg " +
                    (role === "you" ? "user" : "assistant") +
                    (isLoading ? " loading" : "");
                const contentHtml = isLoading
                    ? escapeHtml(text)
                    : marked.parse(text || "");
                div.innerHTML =
                    '<div class="role">' + role + '</div><div class="content">' + contentHtml + "</div>";
                messagesEl.appendChild(div);
                messagesEl.scrollTop = messagesEl.scrollHeight;
                return div;
            }

            function escapeHtml(s) {
                const d = document.createElement("div");
                d.textContent = s;
                return d.innerHTML;
            }

            const TOOL_NAMES = {
                search_restaurant_menu: "Menu Check",
                find_ingredient_substitute: "Substitute",
                generate_allergen_disclaimer: "Travel Card",
            };

            function statusTag(result) {
                if (result.error) return '<span class="status-tag error">Error</span>';
                if (result.status === "likely_contains") return '<span class="status-tag contains">Contains</span>';
                if (result.status === "not_found_in_ingredients") return '<span class="status-tag not-listed">Not listed</span>';
                if (result.status === "ask_restaurant") return '<span class="status-tag ask">Ask staff</span>';
                return "";
            }

            function renderToolCard(call) {
                const toolName = TOOL_NAMES[call.name] || call.name;
                let result;
                try {
                    result = JSON.parse(call.result);
                } catch (e) {
                    result = null;
                }

                const card = document.createElement("div");
                card.className = "tool-card" + (result && result.status === "likely_contains" ? " status-contains" : "");

                const head = document.createElement("div");
                head.className = "tool-head";
                let target = call.args.restaurant_name || call.args.allergenic_ingredient || call.args.target_language || "";
                if (call.args.restaurant_name && call.args.location) {
                    target += ", " + call.args.location;
                }
                head.innerHTML =
                    '<span class="tool-name">' + escapeHtml(toolName) + "</span>" +
                    (result ? statusTag(result) : "") +
                    (target ? '<span class="tool-target">' + escapeHtml(target) + "</span>" : "");
                card.appendChild(head);

                const body = document.createElement("div");
                body.className = "tool-body";

                if (!result) {
                    body.innerHTML = '<div class="field-value">' + escapeHtml(call.result) + "</div>";
                } else if (result.error) {
                    body.innerHTML =
                        '<div class="field-value">' + escapeHtml(result.error) + "</div>" +
                        (result.suggestion ? '<div class="suggestion-line">' + escapeHtml(result.suggestion) + "</div>" : "");
                } else {
                    // Lead with the headline (the direct answer), then supporting detail.
                    if (result.headline) {
                        body.innerHTML += '<div class="field-value"><strong>' + escapeHtml(result.headline) + "</strong></div>";
                    }
                    if (result.location_ambiguous && result.location_options && result.location_options.length) {
                        let html = '<div class="field-label">Multiple locations found -- which city?</div><ul>';
                        for (const loc of result.location_options) html += "<li>" + escapeHtml(loc) + "</li>";
                        html += "</ul>";
                        body.innerHTML += html;
                    }
                    // Cuisine-level caution (hidden sources like fish sauce or shrimp paste)
                    // comes before specific dish lists -- it's the non-obvious, genuinely
                    // useful information for someone who already knows to avoid a dish whose
                    // name says the allergen.
                    if (result.cuisine_caution) {
                        let html = '<div class="field-label">Worth knowing about this cuisine</div>';
                        html += '<div class="field-value">' + marked.parseInline(result.cuisine_caution) + "</div>";
                        body.innerHTML += html;
                    }
                    if (result.candidate_dishes && result.candidate_dishes.length) {
                        let html = '<div class="field-label">Worth asking about (' + escapeHtml(result.allergen_queried || "allergen") + ' not listed)</div><ul>';
                        for (const d of result.candidate_dishes) html += "<li>" + escapeHtml(d) + "</li>";
                        html += "</ul>";
                        body.innerHTML += html;
                    }
                    if (result.flagged_dishes && result.flagged_dishes.length) {
                        let html = '<div class="field-label">Contains ' + escapeHtml(result.allergen_queried || "allergen") + ' (not obvious from the name)</div><ul>';
                        for (const d of result.flagged_dishes) html += "<li>" + escapeHtml(d) + "</li>";
                        html += "</ul>";
                        body.innerHTML += html;
                    }
                    // Fall back to whatever text field is richest if there's no headline
                    // (e.g. translated_card, or a plain message for inconclusive lookups).
                    const bodyText = result.explanation || result.translated_card || result.message || "";
                    if (bodyText) {
                        body.innerHTML += '<div class="field-value">' + marked.parseInline(bodyText) + "</div>";
                    }
                    if (result.cultural_notes && result.cultural_notes.length) {
                        let html = '<div class="field-label">Cuisine notes</div><ul>';
                        for (const note of result.cultural_notes) html += "<li>" + escapeHtml(note) + "</li>";
                        html += "</ul>";
                        body.innerHTML += html;
                    }
                    if (result.substitutes && result.substitutes.length) {
                        let html = '<div class="field-label">Substitutes</div><ul>';
                        for (const s of result.substitutes) {
                            html += "<li>" + escapeHtml(typeof s === "string" ? s : JSON.stringify(s)) + "</li>";
                        }
                        html += "</ul>";
                        body.innerHTML += html;
                    }
                    if (result.suggestion) {
                        body.innerHTML += '<div class="suggestion-line">' + escapeHtml(result.suggestion) + "</div>";
                    }
                    // The full warning text is preserved here for transparency (and in the
                    // raw tool_calls JSON), just shown compactly -- the persistent footer
                    // disclaimer covers the everyday reminder so this doesn't repeat a large
                    // warning on every single message.
                    if (result.warning) {
                        body.innerHTML += '<div class="warning-compact">' + escapeHtml(result.warning) + "</div>";
                    }
                }

                card.appendChild(body);
                return card;
            }

            async function send(overrideText) {
                const text = (overrideText !== undefined ? overrideText : userInput.value).trim();
                if (!text) return;

                userInput.value = "";
                sendBtn.disabled = true;
                addMessage("you", text);
                const loading = addMessage("assistant", "Thinking...", true);

                try {
                    const res = await fetch("/chat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            message: text,
                            session_id: sessionId,
                        }),
                    });
                    const data = await res.json();
                    sessionId = data.session_id;

                    for (const call of data.tool_calls || []) {
                        messagesEl.insertBefore(renderToolCard(call), loading);
                    }
                    loading.querySelector(".content").innerHTML = marked.parse(data.response || "");
                    loading.classList.remove("loading");
                } catch (e) {
                    loading.querySelector(".content").textContent = "Error: " + e.message;
                    loading.classList.remove("loading");
                }
                sendBtn.disabled = false;
                userInput.focus();
                messagesEl.scrollTop = messagesEl.scrollHeight;
            }

            sendBtn.addEventListener("click", () => send());
            userInput.addEventListener("keydown", function (e) {
                if (e.key === "Enter") send();
            });
            startersEl.addEventListener("click", function (e) {
                const chip = e.target.closest(".chip");
                if (chip) send(chip.dataset.q);
            });

            // The intro lives inside #messages (not as a separate pinned
            // section) so it scrolls away with the rest of the conversation
            // like any other first message, instead of staying fixed in place.
            function addIntroCard() {
                const card = document.createElement("div");
                card.className = "intro-card";
                card.innerHTML =
                    '<p class="intro-lede">Hi! I\'m a food allergy assistant. Tell me your allergies, and I can help with:</p>' +
                    '<div class="capability"><div class="cap-name">Eating out?</div>' +
                    '<div class="cap-desc">I can check a dish, or a whole menu, at a restaurant you name.</div></div>' +
                    '<div class="capability"><div class="cap-name">Want to make a recipe allergen-free?</div>' +
                    '<div class="cap-desc">I can swap an ingredient in a recipe for something safe to cook with.</div></div>' +
                    '<div class="capability"><div class="cap-name">Upcoming travel plans?</div>' +
                    '<div class="cap-desc">I can generate an allergy card and flag some of the top dishes to avoid wherever you\'re traveling, named in both English and the local language.</div></div>' +
                    '<p class="intro-ask">What are your allergies, and what do you need?</p>';
                messagesEl.appendChild(card);
            }

            addIntroCard();
            userInput.focus();
        </script>
    </body>
</html>
